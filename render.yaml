# Render deployment blueprint. Render reads this file automatically when you
# connect the repo via "New > Blueprint" in the Render dashboard.
#
# What this defines:
#   1. A Postgres database (survives restarts — SQLite can't, on a cloud host)
#   2. The web service (your FastAPI app + dashboard)
#
# The two sync scripts (sync_workfront.py, sync_hours.py) do NOT run as Render
# cron jobs — Render doesn't offer a free plan for cron jobs, only for web
# services and databases. Instead they run as free GitHub Actions scheduled
# workflows: see .github/workflows/sync-workfront.yml and sync-hours.yml.
# Those need the same DATABASE_URL (this database's EXTERNAL connection
# string — see DEPLOYMENT.md) plus your Workfront/OpenAI credentials, set as
# GitHub repo secrets (Settings > Secrets and variables > Actions), not here.
#
# Secrets (API keys, tokens) are NOT in this file — Render prompts you for
# them in the dashboard when you deploy, and stores them encrypted. See
# DEPLOYMENT.md for the full walkthrough.

databases:
  - name: timesheet-ai-db
    plan: free          # upgrade to a paid plan before real usage — the free
                         # Postgres tier is deleted after 90 days of inactivity
    databaseName: timesheet_ai
    user: timesheet_ai

services:
  # --- the web app (API + dashboard) — the only Render compute service ---
  - type: web
    name: timesheet-ai-backend
    runtime: python
    plan: free           # sleeps after 15 min idle; first request after that takes ~30-60s to wake.
                         # Upgrade to 'starter' (~$7/mo) later for always-on, no code change needed.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-ai-db
          property: connectionString
      - key: WORKFRONT_MODE
        value: real
      - key: WORKFRONT_BASE_URL
        sync: false       # set manually in the Render dashboard (not sensitive but instance-specific)
      - key: WORKFRONT_CLIENT_ID
        sync: false       # SECRET — set manually in the dashboard (auto-refreshing auth)
      - key: WORKFRONT_CLIENT_SECRET
        sync: false       # SECRET — set manually in the dashboard
      - key: MOCK_LLM
        value: "false"
      - key: OPENAI_API_KEY
        sync: false       # SECRET — set manually in the dashboard
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: DEFAULT_EXPECTED_HOURS
        value: "40"
      - key: NON_STANDARD_UTIL_THRESHOLD
        value: "0.3"
      - key: RECOMMENDATION_STALENESS_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO
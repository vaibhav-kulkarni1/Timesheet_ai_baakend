# Render deployment blueprint. Render reads this file automatically when you
# connect the repo via "New > Blueprint" in the Render dashboard — it creates
# every service below in one step.
#
# What this defines:
#   1. A Postgres database (survives restarts — SQLite can't, on a cloud host)
#   2. The web service (your FastAPI app + dashboard)
#   3. Two cron jobs (the syncs you currently run by hand)
#
# Secrets (API keys, tokens) are NOT in this file — Render prompts you for
# them in the dashboard when you deploy, and stores them encrypted. See
# DEPLOYMENT.md for the full walkthrough.

databases:
  - name: timesheet-ai-db
    plan: free          # upgrade to a paid plan before real usage — the free
                         # Postgres tier is deleted after 90 days of inactivity
    databaseName: timesheet_ai
    user: timesheet_ai

services:
  # --- the web app (API + dashboard) ---
  - type: web
    name: timesheet-ai-backend
    runtime: python
    plan: free           # sleeps after 15 min idle; first request after that takes ~30-60s to wake.
                         # Upgrade to 'starter' (~$7/mo) later for always-on, no code change needed.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-ai-db
          property: connectionString
      - key: WORKFRONT_MODE
        value: real
      - key: WORKFRONT_BASE_URL
        sync: false       # set manually in the Render dashboard (not sensitive but instance-specific)
      - key: WORKFRONT_CLIENT_ID
        sync: false       # SECRET — set manually in the dashboard (preferred: auto-refreshing auth)
      - key: WORKFRONT_CLIENT_SECRET
        sync: false       # SECRET — set manually in the dashboard
      - key: MOCK_LLM
        value: "false"
      - key: OPENAI_API_KEY
        sync: false       # SECRET — set manually in the dashboard
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: DEFAULT_EXPECTED_HOURS
        value: "40"
      - key: NON_STANDARD_UTIL_THRESHOLD
        value: "0.3"
      - key: RECOMMENDATION_STALENESS_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO

  # --- scheduled sync: timesheets (every 30 min) ---
  - type: cron
    name: sync-workfront
    runtime: python
    plan: free           # cron jobs run on schedule regardless of plan; free is fine here
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m scripts.sync_workfront"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-ai-db
          property: connectionString
      - key: WORKFRONT_MODE
        value: real
      - key: WORKFRONT_BASE_URL
        sync: false
      - key: WORKFRONT_CLIENT_ID
        sync: false
      - key: WORKFRONT_CLIENT_SECRET
        sync: false
      - key: MOCK_LLM
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: SYNC_ONLY_WITH_HOURS
        value: "0"

  # --- scheduled sync: hour entries (every 2 hours — lower volume) ---
  - type: cron
    name: sync-hours
    runtime: python
    plan: free           # cron jobs run on schedule regardless of plan; free is fine here
    schedule: "0 */2 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m scripts.sync_hours"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-ai-db
          property: connectionString
      - key: WORKFRONT_MODE
        value: real
      - key: WORKFRONT_BASE_URL
        sync: false
      - key: WORKFRONT_CLIENT_ID
        sync: false
      - key: WORKFRONT_CLIENT_SECRET
        sync: false
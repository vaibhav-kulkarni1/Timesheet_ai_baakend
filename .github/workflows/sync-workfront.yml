name: Sync Workfront timesheets

# Replaces Render's cron job for this sync (which requires a paid plan) with
# a free GitHub Actions scheduled workflow. Runs the same script, against
# the same Render Postgres database, at no cost.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub's scheduler is best-effort,
                              # may run a few minutes late under load — fine for this)
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKFRONT_MODE: real
          WORKFRONT_BASE_URL: ${{ secrets.WORKFRONT_BASE_URL }}
          WORKFRONT_CLIENT_ID: ${{ secrets.WORKFRONT_CLIENT_ID }}
          WORKFRONT_CLIENT_SECRET: ${{ secrets.WORKFRONT_CLIENT_SECRET }}
          MOCK_LLM: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
          SYNC_ONLY_WITH_HOURS: "0"
        run: python -m scripts.sync_workfront
name: Sync Workfront hours

# Replaces Render's cron job for this sync (which requires a paid plan) with
# a free GitHub Actions scheduled workflow. Feeds the Utilization,
# Productivity, and daily-comments features.

on:
  schedule:
    - cron: "0 */2 * * *"    # every 2 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKFRONT_MODE: real
          WORKFRONT_BASE_URL: ${{ secrets.WORKFRONT_BASE_URL }}
          WORKFRONT_CLIENT_ID: ${{ secrets.WORKFRONT_CLIENT_ID }}
          WORKFRONT_CLIENT_SECRET: ${{ secrets.WORKFRONT_CLIENT_SECRET }}
        run: python -m scripts.sync_hours
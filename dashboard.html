<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timesheet Approvals</title>
<style>
  :root {
    --ink: #1a1c1f;
    --ink-soft: #55595f;
    --ink-faint: #8b9096;
    --paper: #f6f7f8;
    --card: #ffffff;
    --line: #e5e7ea;
    --line-soft: #eef0f2;

    /* status system — the signature: each state owns one hue */
    --approve: #2e7d5b;   --approve-bg: #e8f3ed;
    --review:  #b7791f;   --review-bg:  #fbf3e2;
    --flagged: #c0392b;   --flagged-bg: #fbeae7;
    --notready:#7a828b;   --notready-bg:#eef0f2;

    --high:   #c0392b;   --high-bg:   #fbeae7;
    --medium: #b7791f;   --medium-bg: #fbf3e2;
    --low:    #4a6b8a;   --low-bg:    #eaf0f5;

    --shadow: 0 1px 2px rgba(20,22,25,.04), 0 4px 16px rgba(20,22,25,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 28px 80px; }

  /* ---- header ---- */
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 8px;
  }
  .title { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; }
  .subtitle { color: var(--ink-faint); font-size: 13.5px; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 10px; }
  .controls input {
    font: inherit; font-size: 13px; padding: 7px 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    width: 230px; color: var(--ink);
  }
  .controls input::placeholder { color: var(--ink-faint); }
  .btn {
    font: inherit; font-size: 13px; font-weight: 550; cursor: pointer;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); transition: background .12s;
    display: inline-flex; align-items: center; text-decoration: none; line-height: 1;
  }
  .btn:hover { background: var(--line-soft); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #333; }

  .status-line { font-size: 12.5px; color: var(--ink-faint); margin: 14px 0 26px; }
  .status-line.err { color: var(--flagged); }

  /* ---- summary strip ---- */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 34px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--accent, var(--line)); }
  .stat .num { font-size: 30px; font-weight: 680; letter-spacing: -0.02em; line-height: 1; }
  .stat .lbl { font-size: 12px; color: var(--ink-faint); margin-top: 7px; text-transform: uppercase; letter-spacing: .04em; }
  .stat.approve { --accent: var(--approve); }
  .stat.review  { --accent: var(--review); }
  .stat.flagged { --accent: var(--flagged); }
  .stat.risk    { --accent: var(--high); }

  /* ---- section ---- */
  section { margin-bottom: 40px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .sec-head h2 { font-size: 17px; font-weight: 640; letter-spacing: -0.01em; }
  .sec-head .count { font-size: 12.5px; color: var(--ink-faint); }
  .sec-desc { font-size: 13px; color: var(--ink-faint); margin-bottom: 16px; }

  /* ---- recommendation rows ---- */
  .rec {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 18px; margin-bottom: 10px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 200px 100px 1fr; gap: 18px; align-items: start;
  }
  .rec .who { font-weight: 600; font-size: 14.5px; }
  .rec .period { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
  .rec .reason { font-size: 13.5px; color: var(--ink-soft); }
  .rec .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .rec .comments {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft);
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.55;
  }
  .rec .comments .clbl { font-weight: 600; color: var(--ink-faint); margin-right: 4px; }
  .chip {
    font-size: 11.5px; color: var(--ink-soft); background: var(--paper);
    border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px;
  }

  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 650; letter-spacing: .03em;
    padding: 4px 10px; border-radius: 6px; text-transform: uppercase; white-space: nowrap;
  }
  .badge.APPROVE  { color: var(--approve);  background: var(--approve-bg); }
  .badge.REVIEW   { color: var(--review);   background: var(--review-bg); }
  .badge.FLAGGED  { color: var(--flagged);  background: var(--flagged-bg); }
  .badge.NOT_READY{ color: var(--notready); background: var(--notready-bg); }
  .badge.HIGH     { color: var(--high);   background: var(--high-bg); }
  .badge.MEDIUM   { color: var(--medium); background: var(--medium-bg); }
  .badge.LOW      { color: var(--low);    background: var(--low-bg); }

  /* ---- anomaly + health rows ---- */
  .arow {
    background: var(--card); border: 1px solid var(--line); border-left-width: 3px;
    border-radius: 10px; padding: 13px 16px; margin-bottom: 9px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: start;
  }
  .arow.HIGH   { border-left-color: var(--high); }
  .arow.MEDIUM { border-left-color: var(--medium); }
  .arow.LOW    { border-left-color: var(--low); }
  .arow .atitle { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
  .arow .adesc { font-size: 13px; color: var(--ink-soft); }
  .arow .awho { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .tab {
    font: inherit; font-size: 14px; font-weight: 550; cursor: pointer;
    padding: 9px 16px; border: none; background: none; color: var(--ink-faint);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .tab .n { font-size: 11.5px; color: var(--ink-faint); margin-left: 5px; }

  .pane { display: none; }
  .pane.active { display: block; }

  .empty { padding: 40px 20px; text-align: center; color: var(--ink-faint); font-size: 13.5px;
           background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

  .skeleton { padding: 50px; text-align: center; color: var(--ink-faint); font-size: 14px; }

  /* ---- utilization / productivity ---- */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .panel h3 { font-size: 14px; font-weight: 640; margin-bottom: 16px; letter-spacing: -0.01em; }
  .bar-row { margin-bottom: 13px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-head .nm { color: var(--ink); font-weight: 500; }
  .bar-head .vl { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .bar-track { height: 8px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; background: var(--proj, #4a6b8a); }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .metric {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .metric .mv { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; line-height: 1; }
  .metric .ml { font-size: 12px; color: var(--ink-faint); margin-top: 7px; text-transform: uppercase; letter-spacing: .04em; }
  .metric .sub { font-size: 12px; margin-top: 4px; }
  .metric .sub.good { color: var(--approve); }
  .metric .sub.over { color: var(--review); }

  @media (max-width: 720px) { .metrics { grid-template-columns: repeat(2, 1fr); } }

  @media (max-width: 720px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .rec { grid-template-columns: 1fr; gap: 8px; }
    .arow { grid-template-columns: 1fr; gap: 6px; }
    .controls input { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="title">Timesheet Approvals</div>
      <div class="subtitle">AI-assisted review across your team</div>
    </div>
    <div class="controls">
      <input id="mgr" type="text" placeholder="Filter by manager ID (optional)" />
      <button class="btn primary" id="reload">Refresh</button>
      <a class="btn" href="/docs" target="_blank" rel="noopener">API docs</a>
    </div>
  </header>

  <div class="status-line" id="status">Connecting to API…</div>

  <div class="summary" id="summary"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-pane="queue">Approval Queue <span class="n" id="n-queue"></span></button>
    <button class="tab" data-pane="anomalies">Anomalies <span class="n" id="n-anom"></span></button>
    <button class="tab" data-pane="utilization">Utilization</button>
    <button class="tab" data-pane="productivity">Productivity</button>
    <button class="tab" data-pane="health">Employee Health <span class="n" id="n-health"></span></button>
  </div>

  <div class="pane active" id="pane-queue"><div class="skeleton">Loading…</div></div>
  <div class="pane" id="pane-anomalies"><div class="skeleton">Loading…</div></div>
  <div class="pane" id="pane-utilization"><div class="skeleton">Loading…</div></div>
  <div class="pane" id="pane-productivity"><div class="skeleton">Loading…</div></div>
  <div class="pane" id="pane-health"><div class="skeleton">Loading…</div></div>

</div>

<script>
// Served by the backend at /dashboard, so same-origin relative calls work.
// If you open this file directly (file://) instead, set API = "http://localhost:8000".
const API = "";
let managerId = "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q = (obj) => {
  const p = new URLSearchParams();
  Object.entries(obj).forEach(([k,v]) => { if (v !== "" && v != null) p.set(k, v); });
  const s = p.toString();
  return s ? "?" + s : "";
};

async function getJSON(path) {
  // cache: "no-store" so a browser (or intermediate cache) never serves a
  // stale JSON response for these live API calls.
  const r = await fetch(API + path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

function setStatus(msg, isErr=false) {
  const el = $("status");
  el.textContent = msg;
  el.classList.toggle("err", isErr);
}

// ---- tabs ----
$("tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".pane").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("pane-" + t.dataset.pane).classList.add("active");
});

$("reload").addEventListener("click", loadAll);
$("mgr").addEventListener("keydown", (e) => { if (e.key === "Enter") loadAll(); });

// ---- renderers ----
function renderSummary(stats, healthCounts) {
  const c = stats.counts || {};
  const risk = (healthCounts.HIGH || 0) + (healthCounts.MEDIUM || 0);
  $("summary").innerHTML = `
    <div class="stat approve"><div class="num">${c.APPROVE ?? 0}</div><div class="lbl">Ready to approve</div></div>
    <div class="stat review"><div class="num">${c.REVIEW ?? 0}</div><div class="lbl">Needs review</div></div>
    <div class="stat flagged"><div class="num">${c.FLAGGED ?? 0}</div><div class="lbl">Flagged</div></div>
    <div class="stat risk"><div class="num">${risk}</div><div class="lbl">Burnout watch</div></div>
  `;
}

function renderQueue(rows) {
  $("n-queue").textContent = rows.length ? `(${rows.length})` : "";
  if (!rows.length) { $("pane-queue").innerHTML = emptyMsg("No timesheets waiting on you. All caught up."); return; }
  $("pane-queue").innerHTML = rows.map(r => `
    <div class="rec">
      <div>
        <div class="who">${esc(r.employee_name)}</div>
        <div class="period">${esc(r.period_start)} → ${esc(r.period_end)}</div>
      </div>
      <div><span class="badge ${esc(r.recommendation)}">${esc(r.recommendation)}</span></div>
      <div>
        <div class="reason">${esc(r.reason)}</div>
        <div class="actions">${(r.next_best_actions||[]).map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>
        ${r.comments_summary ? `<div class="comments"><span class="clbl">Daily notes:</span> ${esc(r.comments_summary)}</div>` : ""}
      </div>
    </div>
  `).join("");
}

function renderAnomalies(data) {
  const items = data.anomalies || [];
  $("n-anom").textContent = items.length ? `(${items.length})` : "";
  if (!items.length) { $("pane-anomalies").innerHTML = emptyMsg("No anomalies detected across current timesheets."); return; }
  $("pane-anomalies").innerHTML = items.map(a => `
    <div class="arow ${esc(a.severity)}">
      <div><span class="badge ${esc(a.severity)}">${esc(a.severity)}</span></div>
      <div>
        <div class="atitle">${esc(a.title)}</div>
        <div class="adesc">${esc(a.description)}</div>
        <div class="awho">${esc(a.employee_name)} · ${esc(a.period_start)}</div>
      </div>
    </div>
  `).join("");
}

function renderHealth(data) {
  const items = data.employees || [];
  $("n-health").textContent = items.length ? `(${items.length})` : "";
  if (!items.length) { $("pane-health").innerHTML = emptyMsg("No burnout signals. Overtime and leave look healthy."); return; }
  $("pane-health").innerHTML = items.map(h => {
    const m = h.metrics || {};
    return `
    <div class="arow ${esc(h.risk)}">
      <div><span class="badge ${esc(h.risk)}">${esc(h.risk)}</span></div>
      <div>
        <div class="atitle">${esc(h.employee_name)}</div>
        <div class="adesc">${esc(h.reason)}</div>
        <div class="awho">${esc(m.overtime_hours_window)}h overtime · ${esc(m.overtime_periods)} periods · ${m.no_recent_leave ? "no recent leave" : "took leave"}</div>
      </div>
    </div>`;
  }).join("");
}

function emptyMsg(text) { return `<div class="empty">${esc(text)}</div>`; }

function bars(items, colorVar) {
  if (!items || !items.length) return "";
  const max = Math.max(...items.map(i => i.pct)) || 100;
  return items.map(i => `
    <div class="bar-row">
      <div class="bar-head"><span class="nm">${esc(i.name)}</span><span class="vl">${esc(i.hours)}h · ${esc(i.pct)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(i.pct/max*100).toFixed(1)}%; --proj:${colorVar}"></div></div>
    </div>`).join("");
}

function renderUtilization(d) {
  if (!d || !d.total_hours) { $("pane-utilization").innerHTML = emptyMsg("No hour data yet. Run: python -m scripts.sync_hours"); return; }
  $("pane-utilization").innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="mv">${esc(d.total_hours)}h</div><div class="ml">Total logged</div></div>
      <div class="metric"><div class="mv">${d.by_project.length}</div><div class="ml">Projects</div></div>
      <div class="metric"><div class="mv">${d.by_role.length}</div><div class="ml">Roles</div></div>
      <div class="metric"><div class="mv">${d.window_days ? d.window_days + "d" : "All"}</div><div class="ml">Window</div></div>
    </div>
    <div class="panel"><h3>Hours by project</h3>${bars(d.by_project, "#4a6b8a") || emptyMsg("No projects.")}</div>
    <div class="panel"><h3>Hours by role</h3>${bars(d.by_role, "#2e7d5b") || emptyMsg("No roles.")}</div>
  `;
}

function renderProductivity(d) {
  if (!d || d.tasks_total === 0) { $("pane-productivity").innerHTML = emptyMsg("No task data yet. Run: python -m scripts.sync_hours"); return; }
  const over = d.variance_hours > 0;
  const effClass = (d.efficiency_pct != null && d.efficiency_pct >= 100) ? "good" : "over";
  $("pane-productivity").innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="mv">${esc(d.planned_hours)}h</div><div class="ml">Planned</div></div>
      <div class="metric"><div class="mv">${esc(d.actual_hours)}h</div><div class="ml">Actual</div>
        <div class="sub ${over ? "over" : "good"}">${over ? "+" : ""}${esc(d.variance_hours)}h vs plan</div></div>
      <div class="metric"><div class="mv">${d.efficiency_pct != null ? esc(d.efficiency_pct)+"%" : "—"}</div><div class="ml">Efficiency</div>
        <div class="sub ${effClass}">${d.efficiency_pct != null ? (d.efficiency_pct >= 100 ? "under budget" : "over budget") : ""}</div></div>
      <div class="metric"><div class="mv">${esc(d.deliverables_completed)}</div><div class="ml">Deliverables</div>
        <div class="sub">of ${esc(d.tasks_total)} tasks</div></div>
    </div>
    <div class="panel"><h3>Planned vs actual</h3>
      ${bars([
        {name:"Planned", hours:d.planned_hours, pct: d.planned_hours >= d.actual_hours ? 100 : Math.round(d.planned_hours/d.actual_hours*100)},
        {name:"Actual",  hours:d.actual_hours,  pct: d.actual_hours >= d.planned_hours ? 100 : Math.round(d.actual_hours/d.planned_hours*100)},
      ], "#b7791f")}
    </div>
  `;
}

// ---- load ----
async function loadAll() {
  managerId = $("mgr").value.trim();
  setStatus("Loading…");
  ["queue","anomalies","health","utilization","productivity"].forEach(p => $("pane-"+p).innerHTML = `<div class="skeleton">Loading…</div>`);

  try {
    const [stats, queue, anomalies, health, util, prod] = await Promise.all([
      getJSON("/api/recommendations/stats" + q({manager_id: managerId})),
      getJSON("/api/recommendations" + q({manager_id: managerId, pending_only: true})),
      getJSON("/api/anomalies" + q({manager_id: managerId})),
      getJSON("/api/employee-health" + q({manager_id: managerId})),
      getJSON("/api/utilization"),
      getJSON("/api/productivity"),
    ]);

    renderSummary(stats, (health.counts||{}));
    renderQueue(queue);
    renderAnomalies(anomalies);
    renderHealth(health);
    renderUtilization(util);
    renderProductivity(prod);

    const when = new Date().toLocaleTimeString();
    setStatus(`Live · updated ${when}${managerId ? ` · manager ${managerId}` : ""}`);
  } catch (err) {
    setStatus(`Can't reach the API (${esc(err.message)}). Is the server running? Start it with: uvicorn app.main:app --reload`, true);
    ["queue","anomalies","health","utilization","productivity"].forEach(p => $("pane-"+p).innerHTML = emptyMsg("No data — API unavailable."));
  }
}

loadAll();
</script>
</body>
</html>
